<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登记昵称 · 限定猜拳</title>
<style>
:root { --bg: #0d0b0a; --panel: #211b17; --line: #3d332b; --text: #f3ebdd; --muted: #9c8f7e; --red: #d0232c; --gold: #f2c230; --green: #3fb56b; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
main { max-width: 420px; margin: 0 auto; padding: 18px 16px 40px; }
h1 { font-size: 22px; margin: 4px 0 2px; }
h1 span { color: var(--red); }
p { color: var(--muted); margin: 4px 0 14px; font-size: 14px; }
.dev { display: inline-block; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px 10px; font-size: 13px; color: var(--muted); }
label { display: block; font-size: 14px; color: var(--muted); margin: 16px 0 4px; }
input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: #151210; color: var(--text); font: inherit; font-size: 20px; }
#count { text-align: right; font-size: 13px; color: var(--muted); margin-top: 4px; }
#count.over { color: #ff8a8a; }
#go { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--red); color: #fff; font: inherit; font-size: 18px; font-weight: 700; }
#go:disabled { opacity: .5; }
#msg { margin-top: 14px; min-height: 24px; font-size: 15px; }
#msg.ok { color: var(--green); } #msg.bad { color: #ff8a8a; } #msg.wait { color: var(--gold); }
</style>
</head>
<body>
<main>
  <h1>登记昵称 · <span>限定猜拳</span></h1>
  <p>对决、碰拳时，对手的设备上会显示你的昵称。不需要电脑，昵称就保存在这台设备里。</p>
  <span class="dev" id="dev">设备</span>
  <form id="form" autocomplete="off">
    <label for="name">昵称（最多 8 个汉字或 16 个字母）</label>
    <input id="name" name="name" maxlength="24" required>
    <div id="count"></div>
    <button id="go" type="submit">保存昵称</button>
  </form>
  <div id="msg"></div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const ERR = { empty: "请填写昵称", long: "昵称太长了：最多 8 个汉字或 16 个字母", ctrl: "昵称里有看不见的控制字符，请重新输入",
  form: "提交的内容不完整，请重试" };

function say(text, cls) { const m = $("msg"); m.textContent = text; m.className = cls || ""; }
// 显示宽度：汉字记 2、字母数字记 1（与设备的规则一致）
function units(s) { let n = 0; for (const ch of s) n += ch.codePointAt(0) < 0x80 ? 1 : 2; return n; }
function showCount() {
  const n = units($("name").value.trim());
  const c = $("count");
  c.textContent = n ? `${n} / 16` : "";
  c.className = n > 16 ? "over" : "";
}

async function info() {
  try {
    const r = await fetch("info", { cache: "no-store" });
    const d = await r.json();
    $("dev").textContent = "设备 " + d.dev;      // 只用 textContent：内容来自设备，按纯文本显示
    if (d.name && !$("name").value) $("name").value = d.name;
    showCount();
  } catch (e) { /* 网页可能正在切换，忽略 */ }
}

$("name").addEventListener("input", showCount);
$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const body = new URLSearchParams({ name: $("name").value });
  $("go").disabled = true;
  say("正在保存…", "wait");
  try {
    const r = await fetch("name", { method: "POST", body, headers: { "Content-Type": "application/x-www-form-urlencoded" } });
    const res = await r.json();
    if (res.ok) {
      say("登记成功！设备马上回到游戏，手机可以断开这个热点了。", "ok");
      return;
    }
    say(res.err === "chars" ? `设备显示不了这些字：${res.bad}，换一个吧` : (ERR[res.err] || "保存失败，请重试"), "bad");
  } catch (e) { say("保存失败，请重试", "bad"); }
  $("go").disabled = false;
});
info();
</script>
</body>
</html>
